[project]
name = "arcana"
version = "1.0.0"
description = "Arcana: Veil of Destiny - The Definitive Mystical CLI Tarot Game & Divination Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["arcana"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
